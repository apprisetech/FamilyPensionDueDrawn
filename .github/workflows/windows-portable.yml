name: Build Windows Portable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and test portable package
        run: python build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyPensionTool-Windows-Portable
          path: FamilyPensionTool_Windows_Portable.zip
          if-no-files-found: error
